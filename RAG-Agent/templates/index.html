<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 文档检索系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        /* 基本的备用样式，防止外部CSS加载失败 */
        .loading {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">RAG 文档检索系统</h1>

        <ul class="nav nav-tabs" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search"
                    type="button" role="tab" aria-controls="search" aria-selected="true">知识问答</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="manage-tab" data-bs-toggle="tab" data-bs-target="#manage" type="button"
                    role="tab" aria-controls="manage" aria-selected="false">知识库管理</button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabContent">
            <!-- 搜索问答页面 -->
            <div class="tab-pane fade show active" id="search" role="tabpanel" aria-labelledby="search-tab">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <form id="searchForm" class="mb-4">
                            <div class="mb-3">
                                <select id="templateSelect" class="form-select template-select" aria-label="选择问答模板">
                                    <option value="">不使用示例模板</option>
                                    <option value="standard">标准问答模板</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <input type="text" id="query" class="form-control" placeholder="请输入您的问题...">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search me-1"></i>搜索
                                    <span class="badge bg-success ms-1" data-bs-toggle="tooltip"
                                        title="使用流式响应，实时显示生成内容">
                                        <i class="bi bi-lightning-charge-fill"></i>
                                    </span>
                                </button>
                            </div>
                        </form>

                        <div class="loading text-center mb-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>

                        <div id="results">
                            <div id="answer"></div>
                            <div id="sources"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 知识库管理页面 -->
            <div class="tab-pane fade" id="manage" role="tabpanel" aria-labelledby="manage-tab">
                <div class="row">
                    <div class="col-md-7">
                        <!-- 文件上传表单 -->
                        <div class="upload-form">
                            <h4>上传新文档</h4>
                            <form id="uploadForm" class="mb-3">
                                <div class="mb-3">
                                    <label for="fileUpload" class="form-label">选择文件（只支持TXT格式）</label>
                                    <input class="form-control" type="file" id="fileUpload" accept=".txt">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">更新模式</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="updateMode" id="addMode"
                                            value="add" checked>
                                        <label class="form-check-label" for="addMode">
                                            添加新文件
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="updateMode" id="replaceMode"
                                            value="replace">
                                        <label class="form-check-label" for="replaceMode">
                                            替换同名文件
                                        </label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">上传文件</button>
                            </form>
                            <div id="uploadStatus" class="upload-status alert" role="alert"></div>
                        </div>

                        <!-- 文档列表 -->
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">文档列表</h5>
                                <div>
                                    <button id="refreshDocuments" class="btn btn-sm btn-outline-secondary me-2">
                                        <i class="bi bi-arrow-clockwise"></i> 刷新
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="documentList" class="document-list">
                                    <div class="text-center">
                                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                                            <span class="visually-hidden">加载中...</span>
                                        </div>
                                        <span class="ms-2">加载文档列表...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <!-- 知识库信息 -->
                        <div class="right-panel">
                            <div class="card db-info-card">
                                <div class="card-header">
                                    <h5 class="mb-0">知识库统计</h5>
                                </div>
                                <div class="card-body">
                                    <div id="dbStats">
                                        <div class="text-center">
                                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                                <span class="visually-hidden">加载中...</span>
                                            </div>
                                            <span class="ms-2">加载知识库信息...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">系统信息</h5>
                                </div>
                                <div class="card-body">
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item d-flex justify-content-between align-items-center">
                                            嵌入模型
                                            <span class="badge bg-primary rounded-pill">BAAI/bge-m3</span>
                                        </li>
                                        <li class="list-group-item d-flex justify-content-between align-items-center">
                                            大语言模型
                                            <span class="badge bg-primary rounded-pill">Qwen/Qwen2.5-7B-Instruct</span>
                                        </li>
                                        <li class="list-group-item d-flex justify-content-between align-items-center">
                                            重排序模型
                                            <span class="badge bg-primary rounded-pill">BAAI/bge-reranker-v2-m3</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>

                            <div class="card mt-3">
                                <div class="card-header bg-info text-white">
                                    <h5 class="mb-0"><i class="bi bi-info-circle"></i> 操作说明</h5>
                                </div>
                                <div class="card-body">
                                    <ul class="list-unstyled">
                                        <li><i class="bi bi-check-circle text-success"></i>
                                            <strong>上传文件</strong>：添加或替换知识库中的文档
                                        </li>
                                        <li class="mt-2"><i class="bi bi-trash text-danger"></i>
                                            <strong>删除文档</strong>：从知识库和文件系统中移除文档
                                        </li>
                                        <li class="mt-2"><i class="bi bi-arrow-clockwise text-primary"></i>
                                            <strong>刷新列表</strong>：更新文档列表显示
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteConfirmModalLabel"><i class="bi bi-exclamation-triangle"></i> 确认删除
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <p>您确定要删除文档 <strong id="deleteFileName"></strong> 吗？</p>
                    <p class="text-danger"><i class="bi bi-exclamation-circle"></i> 此操作将从知识库和文件系统中永久删除该文档，且无法恢复。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="bi bi-trash"></i> 确认删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        // 初始化所有tooltips
        document.addEventListener('DOMContentLoaded', function () {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            });
        });
    </script>
</body>

</html>
